# Configuração base, segura para produção: não contém segredos.
# Os valores sensíveis vêm de variáveis de ambiente; sem elas a aplicação não arranca.
# Para desenvolvimento local, o perfil "dev" (application-dev.yml) é ativado por omissão.
server:
  # Plataformas como o Render indicam a porta na variável PORT
  port: ${PORT:8080}

spring:
  application:
    name: agendamento

  profiles:
    default: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Como vamos usar Flyway, o Hibernate apenas valida, não cria tabelas
      ddl-auto: validate
    # A sessão JPA fecha no fim de cada método @Transactional; os DTOs são montados dentro dos services
    open-in-view: false

  data:
    web:
      pageable:
        # Listagens paginadas: ?page=0&size=20&sort=name,asc
        default-page-size: 20
        max-page-size: 100
        # JSON estável: { "content": [...], "page": { "size", "number", "totalElements", "totalPages" } }
        serialization-mode: via-dto

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

api:
  # Fuso dos horários do negócio: todas as datas da API são locais a este fuso (ver TimeConfig)
  time-zone: ${APP_TIME_ZONE:Europe/Lisbon}
  security:
    token:
      # Mínimo de 32 caracteres (HMAC-SHA256)
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:86400000}
    login:
      # Força bruta: após max-attempts passwords erradas, o email fica bloqueado durante lock-duration (429)
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lock-duration: ${LOGIN_LOCK_DURATION:15m}
  admin:
    # Opcional: cria o primeiro ADMIN ao arrancar, se esse email ainda não existir (ver AdminBootstrap)
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

# Só o health fica exposto (público, sem detalhes): /actuator/health, /health/liveness e /health/readiness
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
