spring:
  application:
    name: agendamento

  datasource:
    url: jdbc:postgresql://localhost:5432/agendamentodb
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Como vamos usar Flyway, o Hibernate apenas valida, não cria tabelas
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

api:
  security:
    token:
      # secret: ${JWT_SECRET}
      secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000

logging:
  level:
    org.springframework.security: TRACE
    com.bilangieri.agendamento.security: DEBUG