# Configuração base, segura para produção: não contém segredos.
# Os valores sensíveis vêm de variáveis de ambiente; sem elas a aplicação não arranca.
# Para desenvolvimento local, o perfil "dev" (application-dev.yml) é ativado por omissão.
spring:
  application:
    name: agendamento

  profiles:
    default: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Como vamos usar Flyway, o Hibernate apenas valida, não cria tabelas
      ddl-auto: validate
    # A sessão JPA fecha no fim de cada método @Transactional; os DTOs são montados dentro dos services
    open-in-view: false

  data:
    web:
      pageable:
        # Listagens paginadas: ?page=0&size=20&sort=name,asc
        default-page-size: 20
        max-page-size: 100
        # JSON estável: { "content": [...], "page": { "size", "number", "totalElements", "totalPages" } }
        serialization-mode: via-dto

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

api:
  security:
    token:
      # Mínimo de 32 caracteres (HMAC-SHA256)
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:86400000}
  admin:
    # Opcional: cria o primeiro ADMIN ao arrancar, se esse email ainda não existir (ver AdminBootstrap)
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
